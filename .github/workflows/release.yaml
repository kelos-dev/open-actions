name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "${#VERSION}" -gt 128 ]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH and be no more than 128 characters" >&2
              exit 1
            fi
          else
            VERSION=main
          fi
          printf 'revision=sha-%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

  build-images:
    needs: determine-version
    strategy:
      max-parallel: 1
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ needs.determine-version.outputs.revision }}
        run: make image PUSH=true VERSION="${REVISION}-${ARCH}"

  merge-manifests:
    needs: [determine-version, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push immutable manifests
        env:
          REVISION: ${{ needs.determine-version.outputs.revision }}
        run: make manifest IMAGE_PLATFORMS=linux/amd64,linux/arm64 SOURCE_VERSION="$REVISION" VERSION="$REVISION"

      - name: Create and push version manifests
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REVISION: ${{ needs.determine-version.outputs.revision }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          if [ "${REF_TYPE}" = branch ]; then
            CURRENT_SHA=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha')
          elif ! CURRENT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" \
            --jq '.sha' 2>/dev/null); then
            echo "::notice::Skipping ${VERSION} tag because the release tag no longer exists"
            exit 0
          fi
          if [ "${GITHUB_SHA}" != "${CURRENT_SHA}" ]; then
            echo "::notice::Skipping ${VERSION} tag because it no longer points to ${GITHUB_SHA}"
            exit 0
          fi

          make manifest IMAGE_PLATFORMS=linux/amd64,linux/arm64 SOURCE_VERSION="$REVISION" VERSION="$VERSION"

      - name: Create and push latest manifests
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.determine-version.outputs.revision }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          if ! CURRENT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" \
            --jq '.sha' 2>/dev/null); then
            echo "::notice::Skipping latest tag because ${VERSION} no longer exists"
            exit 0
          fi
          if [ "${GITHUB_SHA}" != "${CURRENT_SHA}" ]; then
            echo "::notice::Skipping latest tag because ${VERSION} no longer points to ${GITHUB_SHA}"
            exit 0
          fi
          LATEST_VERSION=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
            --jq '.[].ref' \
            | sed 's|refs/tags/||' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V \
            | tail -n 1)
          if [ "${VERSION}" != "${LATEST_VERSION}" ]; then
            echo "::notice::Skipping latest tag because ${VERSION} is not the highest release tag"
            exit 0
          fi

          make manifest IMAGE_PLATFORMS=linux/amd64,linux/arm64 SOURCE_VERSION="$REVISION" VERSION=latest

  release-artifacts:
    needs: [determine-version, merge-manifests]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI binaries
        run: make release-binaries

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: go run ./hack/release-notes "$VERSION" > "${RUNNER_TEMP}/release-notes.md"

      - name: Upload CLI binaries to GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          if ! CURRENT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" \
            --jq '.sha' 2>/dev/null); then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release because ${VERSION} no longer exists"
            exit 0
          fi
          if [ "${GITHUB_SHA}" != "${CURRENT_SHA}" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release because ${VERSION} no longer points to ${GITHUB_SHA}"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release upload "$VERSION" --clobber \
            bin/open-actions-* \
            bin/checksums.txt

  publish-helm-chart:
    needs: release-artifacts
    if: needs.release-artifacts.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.20.1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and push Helm chart
        env:
          VERSION: ${{ github.ref_name }}
        run: make publish-chart HELM=helm VERSION="$VERSION"
