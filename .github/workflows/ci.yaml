name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify
        run: make verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test TEST_FLAGS=-race

  test-artifact-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Expose Node.js 24 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-runtimes"
          ln -s "$(command -v node)" "$RUNNER_TEMP/artifact-runtimes/node24"
          echo "$RUNNER_TEMP/artifact-runtimes" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Test official artifact actions
        run: make test-artifact-actions

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: 3.20.1
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Build images
        run: make image WHAT="cmd/open-actions-controller cmd/open-actions-artifact-server cmd/open-actions-console cmd/open-actions-runner examples/runner test/fixture/github" VERSION=e2e
      - name: Load images
        run: |
          kind load docker-image ghcr.io/kelos-dev/open-actions-controller:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-artifact-server:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-console:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-runner:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-fixture:e2e
      - name: Build CLI
        run: make build WHAT=cmd/open-actions
      - name: Install control plane
        run: bin/open-actions install --values config/e2e/values.yaml
      - name: Deploy GitHub fixture
        run: kubectl apply -f config/e2e/fixture.yaml
      - name: Wait for components
        run: |
          kubectl wait --for=condition=Available --timeout=180s \
            --namespace open-actions-system \
            deployment/open-actions-controller \
            deployment/open-actions-console \
            deployment/github-fixture
          kubectl rollout status statefulset/open-actions-artifacts \
            --namespace open-actions-system \
            --timeout=180s
      - name: End-to-end test
        env:
          E2E_PROCS: "4"
          E2E_RUNNER_IMAGE: ghcr.io/kelos-dev/open-actions-runner:e2e
        run: make test-e2e
