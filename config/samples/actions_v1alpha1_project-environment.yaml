apiVersion: actions.kelos.dev/v1alpha1
kind: Project
metadata:
  name: environment-example
  namespace: open-actions
spec:
  source:
    type: GitHub
    github:
      appID: 12345
      installationID: 67890
      privateKeySecretRef:
        name: open-actions-github-app
        key: private-key.pem
      webhookSecretRef:
        name: open-actions-github-app
        key: webhook-secret
  workflowDirectory: .open-actions/workflows
  environments:
    - name: ok-to-test
      secretRef:
        name: open-actions-e2e-secrets
      protection:
        requiredApproval: true
