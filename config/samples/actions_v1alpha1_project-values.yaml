apiVersion: actions.kelos.dev/v1alpha1
kind: Project
metadata:
  name: default
  namespace: open-actions
spec:
  secrets:
    secretRef:
      name: open-actions-project-secrets
  variables:
    configMapRef:
      name: open-actions-project-variables
  source:
    type: GitHub
    github:
      appID: 12345
      installationID: 67890
      privateKeySecretRef:
        name: open-actions-github-app
        key: private-key.pem
      webhookSecretRef:
        name: open-actions-github-app
        key: webhook-secret
  workflowDirectory: .open-actions/workflows
