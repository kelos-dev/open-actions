apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-fixture
  labels:
    app.kubernetes.io/name: github-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-fixture
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: ghcr.io/kelos-dev/open-actions-fixture:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: github-fixture
spec:
  selector:
    app.kubernetes.io/name: github-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
