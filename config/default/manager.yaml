apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-actions-controller
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-actions
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-actions
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: open-actions-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/kelos-dev/open-actions-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
          ports:
            - name: webhook
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
