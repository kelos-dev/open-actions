{{- if and .Values.artifacts.enabled (not .Values.artifacts.signingKeySecretName) }}
{{- $keyName := .Values.artifacts.signingKeyKey }}
{{- $signingKey := randBytes 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "open-actions-artifact-auth" }}
{{- if and $existing $existing.data (hasKey $existing.data $keyName) }}
{{- $signingKey = index $existing.data $keyName }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: open-actions-artifact-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: artifacts
type: Opaque
data:
  {{ $keyName }}: {{ $signingKey | quote }}
{{- end }}
