apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-actions-controller
rules:
  - apiGroups: [actions.kelos.dev]
    resources: [projects, runners, workflowjobs, workflowruns]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [actions.kelos.dev]
    resources: [projects/status, runners/status, workflowjobs/status, workflowruns/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-actions-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-actions-controller
subjects:
  - kind: ServiceAccount
    name: open-actions-controller
    namespace: {{ .Release.Namespace }}
