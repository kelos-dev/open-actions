{{- if and .Values.artifacts.enabled (not .Values.artifacts.logReadKeySecretName) }}
{{- $keyName := .Values.artifacts.logReadKeyKey }}
{{- $readKey := randBytes 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "open-actions-log-read-auth" }}
{{- if and $existing $existing.data (hasKey $existing.data $keyName) }}
{{- $readKey = index $existing.data $keyName }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: open-actions-log-read-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: artifacts
type: Opaque
data:
  {{ $keyName }}: {{ $readKey | quote }}
{{- end }}
