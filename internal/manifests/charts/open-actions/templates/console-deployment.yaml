{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-actions-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: open-actions
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-actions
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: open-actions-console
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          args:
            - {{ printf "--github-api-url=%s" .Values.controller.githubAPIURL | quote }}
            - "--token-file=/var/run/secrets/open-actions-console/token"
            {{- if and .Values.artifacts.enabled .Values.artifacts.logs.enabled }}
            - {{ printf "--log-archive-url=http://open-actions-artifacts.%s.svc" .Release.Namespace | quote }}
            - --log-archive-token-file=/var/run/secrets/open-actions-logs/token
            {{- end }}
            {{- if index .Values.console "allowAnonymousWorkflowRuns" }}
            - "--allow-anonymous-workflow-runs=true"
            {{- end }}
            {{- if ne .Values.controller.workflowRunTTLSecondsAfterFinished nil }}
            - {{ printf "--workflow-run-ttl-seconds-after-finished=%d" (int64 .Values.controller.workflowRunTTLSecondsAfterFinished) | quote }}
            {{- end }}
            {{- if hasPrefix "https://" .Values.console.publicURL }}
            - "--secure-cookie=true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: authentication
              mountPath: /var/run/secrets/open-actions-console
              readOnly: true
            {{- if and .Values.artifacts.enabled .Values.artifacts.logs.enabled }}
            - name: log-auth
              mountPath: /var/run/secrets/open-actions-logs
              readOnly: true
            {{- end }}
      volumes:
        - name: authentication
          secret:
            secretName: {{ default "open-actions-console-auth" .Values.console.secretName }}
            items:
              - key: {{ .Values.console.tokenKey | quote }}
                path: token
        {{- if and .Values.artifacts.enabled .Values.artifacts.logs.enabled }}
        - name: log-auth
          secret:
            secretName: {{ default "open-actions-log-auth" .Values.artifacts.logs.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.artifacts.logs.tokenKey | quote }}
                path: token
        {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}
