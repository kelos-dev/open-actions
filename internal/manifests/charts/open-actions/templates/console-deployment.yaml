{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-actions-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: open-actions
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-actions
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: open-actions-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          args:
            - "--token-file=/var/run/secrets/open-actions-console/token"
            - "--secret-management-namespace={{ .Release.Namespace }}"
            {{- if ne .Values.controller.workflowRunTTLSecondsAfterFinished nil }}
            - {{ printf "--workflow-run-ttl-seconds-after-finished=%d" (int64 .Values.controller.workflowRunTTLSecondsAfterFinished) | quote }}
            {{- end }}
            {{- if hasPrefix "https://" .Values.console.publicURL }}
            - "--secure-cookie=true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: authentication
              mountPath: /var/run/secrets/open-actions-console
              readOnly: true
      volumes:
        - name: authentication
          secret:
            secretName: {{ default "open-actions-console-auth" .Values.console.secretName }}
            items:
              - key: {{ .Values.console.tokenKey | quote }}
                path: token
      terminationGracePeriodSeconds: 10
{{- end }}
