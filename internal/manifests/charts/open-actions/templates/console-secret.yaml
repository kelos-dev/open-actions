{{- if and .Values.console.enabled (not .Values.console.secretName) }}
{{- $token := randAlphaNum 48 }}
{{- with (lookup "v1" "Secret" .Release.Namespace "open-actions-console-auth") }}
{{- with (index .data $.Values.console.tokenKey) }}
{{- $token = (. | b64dec) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: open-actions-console-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: console
type: Opaque
stringData:
  {{ .Values.console.tokenKey | quote }}: {{ $token | quote }}
{{- end }}
