{{- if .Values.console.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-actions-console
rules:
  - apiGroups: [actions.kelos.dev]
    resources: [projects, workflowjobs]
    verbs: [get, list]
  - apiGroups: [actions.kelos.dev]
    resources: [workflowruns]
    verbs: [get, list, create, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-actions-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-actions-console
subjects:
  - kind: ServiceAccount
    name: open-actions-console
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: open-actions-console-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-actions-console-secrets
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: open-actions-console-secrets
subjects:
  - kind: ServiceAccount
    name: open-actions-console
    namespace: {{ .Release.Namespace }}
{{- end }}
