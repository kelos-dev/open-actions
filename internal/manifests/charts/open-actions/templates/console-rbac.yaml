{{- if .Values.console.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-actions-console
rules:
  - apiGroups: [actions.kelos.dev]
    resources: [workflowjobs, workflowruns]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-actions-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-actions-console
subjects:
  - kind: ServiceAccount
    name: open-actions-console
    namespace: {{ .Release.Namespace }}
{{- end }}
