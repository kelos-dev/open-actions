{{- if and .Values.artifacts.enabled .Values.artifacts.logs.enabled (not .Values.artifacts.logs.secretName) }}
{{- $keyName := .Values.artifacts.logs.tokenKey }}
{{- $token := randAlphaNum 48 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "open-actions-log-auth" }}
{{- if and $existing $existing.data (hasKey $existing.data $keyName) }}
{{- $token = index $existing.data $keyName }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: open-actions-log-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: artifacts
type: Opaque
data:
  {{ $keyName }}: {{ $token | quote }}
{{- end }}
