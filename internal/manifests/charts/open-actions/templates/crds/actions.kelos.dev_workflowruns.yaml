---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    helm.sh/resource-policy: keep
  name: workflowruns.actions.kelos.dev
spec:
  group: actions.kelos.dev
  names:
    kind: WorkflowRun
    listKind: WorkflowRunList
    plural: workflowruns
    singular: workflowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.workflowName
      name: Workflow
      type: string
    - jsonPath: .spec.source.github.repository.name
      name: Repository
      type: string
    - jsonPath: .spec.source.github.event.name
      name: Event
      type: string
    - jsonPath: .status.conditions[?(@.type=="Succeeded")].status
      name: Succeeded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.source.github.revision.sha
      name: SHA
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkflowRun represents one immutable execution of one workflow at one Git
          revision.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkflowRunSpec describes one workflow execution. ProjectRef, Source,
              WorkflowPath, the fork pull request policy, and Rerun are immutable.
              Set CancelRequested to request graceful cancellation. Deleting a WorkflowRun
              force-cancels and removes its child resources.
            properties:
              cancelRequested:
                description: |-
                  CancelRequested asks the controller to cancel ordinary jobs while allowing
                  jobs whose conditions handle cancellation to finish. Once set, it cannot be
                  cleared.
                type: boolean
              forkPullRequest:
                description: |-
                  ForkPullRequest snapshots the security policy for an ordinary pull_request
                  workflow whose code is treated as untrusted fork content. Dependabot pull
                  requests use the same policy.
                properties:
                  approved:
                    description: |-
                      Approved authorizes this exact WorkflowRun revision to proceed. It may be
                      set from false to true and cannot be cleared.
                    type: boolean
                  requireApproval:
                    description: RequireApproval determines whether approval is required
                      before planning.
                    type: boolean
                  sendSecrets:
                    description: SendSecrets makes the Project Secret available to
                      this workflow.
                    type: boolean
                  sendWriteTokens:
                    description: SendWriteTokens preserves write permissions requested
                      by the workflow.
                    type: boolean
                required:
                - approved
                - requireApproval
                - sendSecrets
                - sendWriteTokens
                type: object
                x-kubernetes-validations:
                - message: approved may be true only when requireApproval is true
                  rule: self.requireApproval || !self.approved
              projectRef:
                description: ProjectRef identifies a Project in the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              rerun:
                description: |-
                  Rerun identifies an earlier attempt and optionally limits execution to
                  selected expanded job IDs. Omit it for the first attempt.
                properties:
                  attempt:
                    description: |-
                      Attempt is the one-based attempt number. The original WorkflowRun is
                      implicitly attempt 1, so reruns start at attempt 2.
                    format: int32
                    maximum: 2147483647
                    minimum: 2
                    type: integer
                  jobIDs:
                    description: |-
                      JobIDs selects expanded WorkflowJob IDs to rerun. Selected jobs reuse the
                      latest available results and outputs of prerequisite jobs from earlier
                      attempts. Omit it to execute every job in the workflow.
                    items:
                      maxLength: 256
                      minLength: 1
                      pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                      type: string
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-type: set
                  originalRunRef:
                    description: OriginalRunRef identifies the first WorkflowRun in
                      this attempt lineage.
                    properties:
                      name:
                        description: Name is the WorkflowRun name in the same namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                        type: string
                      uid:
                        description: UID is the immutable identity of the referenced
                          WorkflowRun.
                        maxLength: 128
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  previousRunRef:
                    description: PreviousRunRef identifies the immediately preceding
                      WorkflowRun attempt.
                    properties:
                      name:
                        description: Name is the WorkflowRun name in the same namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                        type: string
                      uid:
                        description: UID is the immutable identity of the referenced
                          WorkflowRun.
                        maxLength: 128
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  requestID:
                    description: |-
                      RequestID is an optional idempotency identity for the request that created
                      this attempt. GitHub rerequests use the webhook delivery ID.
                    maxLength: 128
                    minLength: 1
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                  triggeringActor:
                    description: |-
                      TriggeringActor is the GitHub login that requested this attempt. It is
                      omitted when the rerun source cannot identify a GitHub user.
                    maxLength: 100
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*(\[bot\])?$
                    type: string
                required:
                - attempt
                - originalRunRef
                - previousRunRef
                type: object
              source:
                description: Source identifies the provider-specific event and repository
                  revision.
                properties:
                  github:
                    description: GitHub records the GitHub trigger, repository, and
                      revision for this run.
                    properties:
                      actor:
                        default: open-actions
                        description: |-
                          Actor is the GitHub login or Open Actions identity that initiated the
                          first attempt. Reruns retain the original actor.
                        maxLength: 100
                        minLength: 1
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*(\[bot\])?$
                        type: string
                      event:
                        description: Event identifies the GitHub-compatible trigger
                          that requested this run.
                        properties:
                          action:
                            description: Action is the payload action, when the event
                              defines one.
                            maxLength: 64
                            minLength: 1
                            pattern: ^[a-z][a-z0-9_]*$
                            type: string
                          comment:
                            description: Comment records the comment body for issue
                              and pull request comment events.
                            properties:
                              body:
                                description: Body is the comment body observed in
                                  the webhook payload.
                                maxLength: 48000
                                type: string
                            required:
                            - body
                            type: object
                          deliveryID:
                            description: |-
                              DeliveryID is the value of the X-GitHub-Delivery header for webhook-backed
                              runs. It must be omitted for manual, scheduled, and reusable-workflow runs.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9-]+$
                            type: string
                          inputs:
                            additionalProperties:
                              type: string
                            description: Inputs contains validated values supplied
                              to a manual or reusable workflow.
                            maxProperties: 25
                            type: object
                            x-kubernetes-validations:
                            - message: input names must start with a letter or '_'
                                and contain at most 100 letters, digits, '-' or '_'
                              rule: self.all(key, key.matches('^[A-Za-z_][A-Za-z0-9_-]{0,99}$'))
                            - message: input values must be no more than 65535 characters
                              rule: self.all(key, size(self[key]) <= 65535)
                            - message: input names and values must contain no more
                                than 65535 characters in total
                              rule: self.map(key, size(key) + size(self[key])).sum()
                                <= 65535
                          issue:
                            description: Issue records bounded issue metadata for
                              issues and issue_comment events.
                            properties:
                              body:
                                description: Body is the issue or pull request body
                                  observed in the webhook payload.
                                maxLength: 48000
                                type: string
                              number:
                                description: Number is the repository-scoped issue
                                  or pull request number.
                                format: int64
                                maximum: 9007199254740991
                                minimum: 1
                                type: integer
                            required:
                            - body
                            - number
                            type: object
                          name:
                            description: Name identifies the GitHub-compatible event
                              that initiated the run.
                            enum:
                            - push
                            - pull_request
                            - merge_group
                            - workflow_run
                            - workflow_dispatch
                            - issues
                            - pull_request_target
                            - issue_comment
                            - pull_request_review_comment
                            - pull_request_review
                            - schedule
                            - release
                            - workflow_call
                            type: string
                          pullRequest:
                            description: |-
                              PullRequest records bounded pull request metadata separately from the
                              trusted revision selected for workflow execution.
                            properties:
                              baseRef:
                                description: BaseRef is the pull request target branch
                                  name.
                                maxLength: 255
                                minLength: 1
                                pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                                type: string
                                x-kubernetes-validations:
                                - message: must be a well-formed GitHub branch name
                                  rule: '!self.startsWith(''/'') && !self.startsWith(''.'')
                                    && !self.startsWith(''refs/'') && !self.endsWith(''/'')
                                    && !self.contains(''//'') && !self.contains(''..'')
                                    && !self.contains(''/.'') && !self.endsWith(''.'')
                                    && !self.contains(''.lock/'') && !self.endsWith(''.lock'')
                                    && !self.contains(''@{'') && !self.matches(''^[0-9A-Fa-f]{40}$'')'
                              body:
                                description: Body is the pull request body observed
                                  in the webhook payload.
                                maxLength: 48000
                                type: string
                              headRef:
                                description: HeadRef is the pull request source branch
                                  name.
                                maxLength: 255
                                minLength: 1
                                pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                                type: string
                                x-kubernetes-validations:
                                - message: must be a well-formed GitHub branch name
                                  rule: '!self.startsWith(''/'') && !self.startsWith(''.'')
                                    && !self.startsWith(''refs/'') && !self.endsWith(''/'')
                                    && !self.contains(''//'') && !self.contains(''..'')
                                    && !self.contains(''/.'') && !self.endsWith(''.'')
                                    && !self.contains(''.lock/'') && !self.endsWith(''.lock'')
                                    && !self.contains(''@{'') && !self.matches(''^[0-9A-Fa-f]{40}$'')'
                              headRepository:
                                description: HeadRepository identifies the repository
                                  containing the pull request head.
                                properties:
                                  id:
                                    description: ID is GitHub's stable numeric repository
                                      identifier.
                                    format: int64
                                    maximum: 9007199254740991
                                    minimum: 1
                                    type: integer
                                  name:
                                    description: Name is the repository name at the
                                      time of the event.
                                    maxLength: 100
                                    minLength: 1
                                    pattern: ^[A-Za-z0-9._-]+$
                                    type: string
                                  owner:
                                    description: Owner is the repository owner's login
                                      at the time of the event.
                                    maxLength: 100
                                    minLength: 1
                                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                                    type: string
                                required:
                                - id
                                - name
                                - owner
                                type: object
                                x-kubernetes-validations:
                                - message: '`name` must be a GitHub repository name'
                                  rule: self.name != '.' && self.name != '..'
                              headSHA:
                                description: HeadSHA is the pull request head commit
                                  observed in the webhook payload.
                                pattern: ^[0-9a-f]{40}$
                                type: string
                              htmlURL:
                                description: HTMLURL is the browser URL for the pull
                                  request.
                                maxLength: 2048
                                minLength: 1
                                pattern: ^https?://[^[:space:]]+$
                                type: string
                              number:
                                description: Number is the repository-scoped pull
                                  request number.
                                format: int64
                                maximum: 9007199254740991
                                minimum: 1
                                type: integer
                            required:
                            - baseRef
                            - body
                            - headRef
                            - headRepository
                            - headSHA
                            - htmlURL
                            - number
                            type: object
                          review:
                            description: Review records the review body for pull_request_review
                              events.
                            properties:
                              body:
                                description: Body is the review body observed in the
                                  webhook payload.
                                maxLength: 48000
                                type: string
                            required:
                            - body
                            type: object
                          schedule:
                            description: Schedule is the validated cron expression
                              that initiated a scheduled run.
                            maxLength: 256
                            minLength: 1
                            pattern: ^[^[:space:]]+([[:space:]]+[^[:space:]]+){4}$
                            type: string
                          workflowRun:
                            description: |-
                              WorkflowRun records bounded metadata about the GitHub Actions workflow run
                              that initiated a workflow_run event.
                            properties:
                              conclusion:
                                description: |-
                                  Conclusion is the completed workflow run conclusion. It is absent while
                                  the triggering run is requested or in progress.
                                maxLength: 64
                                minLength: 1
                                pattern: ^[a-z][a-z_]*$
                                type: string
                              headSHA:
                                description: HeadSHA is the triggering workflow run's
                                  head commit.
                                pattern: ^[0-9a-f]{40}$
                                type: string
                            required:
                            - headSHA
                            type: object
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: push events must not specify action
                          rule: self.name != 'push' || !has(self.action)
                        - message: workflow_dispatch, schedule, and workflow_call
                            events must not specify action
                          rule: '!(self.name in [''workflow_dispatch'', ''schedule'',
                            ''workflow_call'']) || !has(self.action)'
                        - message: pull_request action must be a supported activity
                            type
                          rule: self.name != 'pull_request' || (has(self.action) &&
                            self.action in ['assigned', 'unassigned', 'labeled', 'unlabeled',
                            'opened', 'edited', 'closed', 'reopened', 'synchronize',
                            'converted_to_draft', 'locked', 'unlocked', 'enqueued',
                            'dequeued', 'milestoned', 'demilestoned', 'ready_for_review',
                            'review_requested', 'review_request_removed', 'auto_merge_enabled',
                            'auto_merge_disabled'])
                        - message: pull_request_target action must be a supported
                            activity type
                          rule: self.name != 'pull_request_target' || (has(self.action)
                            && self.action in ['assigned', 'unassigned', 'labeled',
                            'unlabeled', 'opened', 'edited', 'closed', 'reopened',
                            'synchronize', 'converted_to_draft', 'locked', 'unlocked',
                            'enqueued', 'dequeued', 'milestoned', 'demilestoned',
                            'ready_for_review', 'review_requested', 'review_request_removed',
                            'auto_merge_enabled', 'auto_merge_disabled'])
                        - message: merge_group action must be checks_requested
                          rule: self.name != 'merge_group' || (has(self.action) &&
                            self.action == 'checks_requested')
                        - message: workflow_run action must be a supported activity
                            type
                          rule: self.name != 'workflow_run' || (has(self.action) &&
                            self.action in ['completed', 'requested', 'in_progress'])
                        - message: issues action must be a supported activity type
                          rule: self.name != 'issues' || (has(self.action) && self.action
                            in ['opened', 'edited', 'deleted', 'transferred', 'pinned',
                            'unpinned', 'closed', 'reopened', 'assigned', 'unassigned',
                            'labeled', 'unlabeled', 'locked', 'unlocked', 'milestoned',
                            'demilestoned', 'typed', 'untyped', 'field_added', 'field_removed'])
                        - message: issue_comment action must be a supported activity
                            type
                          rule: self.name != 'issue_comment' || (has(self.action)
                            && self.action in ['created', 'edited', 'deleted'])
                        - message: pull_request_review_comment action must be a supported
                            activity type
                          rule: self.name != 'pull_request_review_comment' || (has(self.action)
                            && self.action in ['created', 'edited', 'deleted'])
                        - message: pull_request_review action must be a supported
                            activity type
                          rule: self.name != 'pull_request_review' || (has(self.action)
                            && self.action in ['submitted', 'edited', 'dismissed'])
                        - message: release action must be a supported activity type
                          rule: self.name != 'release' || (has(self.action) && self.action
                            in ['published', 'unpublished', 'created', 'edited', 'deleted',
                            'prereleased', 'released'])
                        - message: pullRequest must be specified for pull_request_target
                            and pull request review events
                          rule: 'self.name in [''pull_request_target'', ''pull_request_review'',
                            ''pull_request_review_comment''] ? has(self.pullRequest)
                            : true'
                        - message: pullRequest may be specified only for pull request
                            events
                          rule: '!has(self.pullRequest) || self.name in [''pull_request'',
                            ''pull_request_target'', ''pull_request_review'', ''pull_request_review_comment'']'
                        - message: workflowRun must be specified exactly for workflow_run
                            events
                          rule: 'self.name == ''workflow_run'' ? has(self.workflowRun)
                            : !has(self.workflowRun)'
                        - message: workflowRun.conclusion must be specified for completed
                            workflow_run events
                          rule: self.name != 'workflow_run' || (has(self.workflowRun)
                            && (self.action != 'completed' || has(self.workflowRun.conclusion)))
                        - message: issue must be specified exactly for issues and
                            issue_comment events
                          rule: 'self.name in [''issues'', ''issue_comment''] ? has(self.issue)
                            : !has(self.issue)'
                        - message: comment must be specified exactly for comment events
                          rule: 'self.name in [''issue_comment'', ''pull_request_review_comment'']
                            ? has(self.comment) : !has(self.comment)'
                        - message: review must be specified exactly for pull_request_review
                            events
                          rule: 'self.name == ''pull_request_review'' ? has(self.review)
                            : !has(self.review)'
                        - message: inputs may be specified only for workflow_dispatch
                            and workflow_call events
                          rule: self.name in ['workflow_dispatch', 'workflow_call']
                            || !has(self.inputs)
                        - message: schedule must be specified exactly for schedule
                            events
                          rule: 'self.name == ''schedule'' ? has(self.schedule) :
                            !has(self.schedule)'
                        - message: deliveryID must be specified exactly for webhook-backed
                            events
                          rule: 'self.name in [''workflow_dispatch'', ''schedule'',
                            ''workflow_call''] ? !has(self.deliveryID) : has(self.deliveryID)'
                      repository:
                        description: Repository identifies the GitHub repository at
                          the time of the event.
                        properties:
                          id:
                            description: ID is GitHub's stable numeric repository
                              identifier.
                            format: int64
                            maximum: 9007199254740991
                            minimum: 1
                            type: integer
                          name:
                            description: Name is the repository name at the time of
                              the event.
                            maxLength: 100
                            minLength: 1
                            pattern: ^[A-Za-z0-9._-]+$
                            type: string
                          owner:
                            description: Owner is the repository owner's login at
                              the time of the event.
                            maxLength: 100
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                            type: string
                        required:
                        - id
                        - name
                        - owner
                        type: object
                        x-kubernetes-validations:
                        - message: '`name` must be a GitHub repository name'
                          rule: self.name != '.' && self.name != '..'
                      revision:
                        description: Revision identifies the repository content executed
                          by the run.
                        properties:
                          baseRef:
                            description: |-
                              BaseRef is the target branch name for pull_request and merge_group execution
                              revisions, when applicable.
                            maxLength: 255
                            minLength: 1
                            pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a well-formed GitHub branch name
                              rule: '!self.startsWith(''/'') && !self.startsWith(''.'')
                                && !self.startsWith(''refs/'') && !self.endsWith(''/'')
                                && !self.contains(''//'') && !self.contains(''..'')
                                && !self.contains(''/.'') && !self.endsWith(''.'')
                                && !self.contains(''.lock/'') && !self.endsWith(''.lock'')
                                && !self.contains(''@{'') && !self.matches(''^[0-9A-Fa-f]{40}$'')'
                          baseSHA:
                            description: |-
                              BaseSHA is the pull request base commit used to construct the integration
                              revision identified by SHA. When present, it is paired with MergeBaseSHA
                              and HeadSHA for an open pull request.
                            pattern: ^[0-9a-f]{40}$
                            type: string
                          headRef:
                            description: |-
                              HeadRef is the pull request source branch name, when applicable to the
                              execution revision.
                            maxLength: 255
                            minLength: 1
                            pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a well-formed GitHub branch name
                              rule: '!self.startsWith(''/'') && !self.startsWith(''.'')
                                && !self.startsWith(''refs/'') && !self.endsWith(''/'')
                                && !self.contains(''//'') && !self.contains(''..'')
                                && !self.contains(''/.'') && !self.endsWith(''.'')
                                && !self.contains(''.lock/'') && !self.endsWith(''.lock'')
                                && !self.contains(''@{'') && !self.matches(''^[0-9A-Fa-f]{40}$'')'
                          headSHA:
                            description: |-
                              HeadSHA is the pull request head commit used for GitHub check reporting.
                              It may differ from SHA when the workflow executes an integration commit.
                              When absent, GitHub checks are reported on SHA.
                            pattern: ^[0-9a-f]{40}$
                            type: string
                          mergeBaseSHA:
                            description: |-
                              MergeBaseSHA is the common ancestor used to construct the integration
                              revision from BaseSHA and HeadSHA.
                            pattern: ^[0-9a-f]{40}$
                            type: string
                          ref:
                            description: |-
                              Ref is the fully qualified Git ref associated with the event. For a
                              deleted push, it records the deleted ref rather than identifying SHA.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a well-formed fully qualified Git ref
                              rule: self.startsWith('refs/') && size(self) > 5 &&
                                !self.contains('//') && !self.contains('..') && !self.contains('/.')
                                && !self.contains('.lock/') && !self.endsWith('/')
                                && !self.endsWith('.') && !self.endsWith('.lock')
                                && !self.contains('@{')
                          sha:
                            description: |-
                              SHA is the full 40-character hexadecimal Git SHA-1 object ID used to
                              discover and execute the workflow. For a deleted push ref, it is resolved
                              from the repository's default branch and does not belong to Ref.
                            pattern: ^[0-9a-f]{40}$
                            type: string
                        required:
                        - ref
                        - sha
                        type: object
                    required:
                    - event
                    - repository
                    - revision
                    type: object
                    x-kubernetes-validations:
                    - message: revision.headRef must be specified exactly for pull_request
                        events
                      rule: 'self.event.name == ''pull_request'' ? has(self.revision.headRef)
                        : !has(self.revision.headRef)'
                    - message: revision.baseRef may be specified only for pull_request
                        and merge_group events
                      rule: '!has(self.revision.baseRef) || self.event.name in [''pull_request'',
                        ''merge_group'']'
                    - message: revision.headSHA may be specified only for pull_request
                        events
                      rule: '!has(self.revision.headSHA) || self.event.name == ''pull_request'''
