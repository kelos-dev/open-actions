---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    helm.sh/resource-policy: keep
  name: workflowruns.actions.kelos.dev
spec:
  group: actions.kelos.dev
  names:
    kind: WorkflowRun
    listKind: WorkflowRunList
    plural: workflowruns
    singular: workflowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.github.repository.name
      name: Repository
      type: string
    - jsonPath: .spec.source.github.event.name
      name: Event
      type: string
    - jsonPath: .status.conditions[?(@.type=="Succeeded")].status
      name: Succeeded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.source.github.revision.sha
      name: SHA
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkflowRun represents one immutable execution of one workflow at one Git
          revision.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkflowRunSpec is an immutable description of one workflow execution.
              Deleting a WorkflowRun requests cancellation of its child resources.
            properties:
              projectRef:
                description: ProjectRef identifies a Project in the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              source:
                description: Source identifies the provider-specific event and repository
                  revision.
                properties:
                  github:
                    description: GitHub records the GitHub delivery and repository
                      revision for this run.
                    properties:
                      event:
                        description: Event identifies the GitHub delivery that requested
                          this run.
                        properties:
                          action:
                            description: Action is the payload action, when the event
                              defines one.
                            maxLength: 64
                            minLength: 1
                            pattern: ^[a-z][a-z0-9_]*$
                            type: string
                          deliveryID:
                            description: DeliveryID is the value of the X-GitHub-Delivery
                              header.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9-]+$
                            type: string
                          name:
                            description: Name is the value of the X-GitHub-Event delivery
                              header.
                            enum:
                            - push
                            - pull_request
                            - merge_group
                            type: string
                        required:
                        - deliveryID
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: push events must not specify action
                          rule: self.name != 'push' || !has(self.action)
                        - message: pull_request action must be a supported activity
                            type
                          rule: self.name != 'pull_request' || (has(self.action) &&
                            self.action in ['assigned', 'unassigned', 'labeled', 'unlabeled',
                            'opened', 'edited', 'closed', 'reopened', 'synchronize',
                            'converted_to_draft', 'locked', 'unlocked', 'enqueued',
                            'dequeued', 'milestoned', 'demilestoned', 'ready_for_review',
                            'review_requested', 'review_request_removed', 'auto_merge_enabled',
                            'auto_merge_disabled'])
                        - message: merge_group action must be checks_requested
                          rule: self.name != 'merge_group' || (has(self.action) &&
                            self.action == 'checks_requested')
                      repository:
                        description: Repository identifies the GitHub repository at
                          the time of the event.
                        properties:
                          id:
                            description: ID is GitHub's stable numeric repository
                              identifier.
                            format: int64
                            maximum: 9007199254740991
                            minimum: 1
                            type: integer
                          name:
                            description: Name is the repository name at the time of
                              the event.
                            maxLength: 100
                            minLength: 1
                            pattern: ^[A-Za-z0-9._-]+$
                            type: string
                          owner:
                            description: Owner is the repository owner's login at
                              the time of the event.
                            maxLength: 100
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                            type: string
                        required:
                        - id
                        - name
                        - owner
                        type: object
                        x-kubernetes-validations:
                        - message: '`name` must be a GitHub repository name'
                          rule: self.name != '.' && self.name != '..'
                      revision:
                        description: Revision identifies the repository content executed
                          by the run.
                        properties:
                          headRef:
                            description: HeadRef is the pull request source branch
                              name, when applicable.
                            maxLength: 255
                            minLength: 1
                            pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a well-formed GitHub branch name
                              rule: '!self.startsWith(''/'') && !self.startsWith(''.'')
                                && !self.startsWith(''refs/'') && !self.endsWith(''/'')
                                && !self.contains(''//'') && !self.contains(''..'')
                                && !self.contains(''/.'') && !self.endsWith(''.'')
                                && !self.contains(''.lock/'') && !self.endsWith(''.lock'')
                                && !self.contains(''@{'') && !self.matches(''^[0-9A-Fa-f]{40}$'')'
                          ref:
                            description: |-
                              Ref is the fully qualified Git ref associated with the event. For a
                              deleted push, it records the deleted ref rather than identifying SHA.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[^\x00-\x20\x7f~^:?*\[\\]+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a well-formed fully qualified Git ref
                              rule: self.startsWith('refs/') && size(self) > 5 &&
                                !self.contains('//') && !self.contains('..') && !self.contains('/.')
                                && !self.contains('.lock/') && !self.endsWith('/')
                                && !self.endsWith('.') && !self.endsWith('.lock')
                                && !self.contains('@{')
                          sha:
                            description: |-
                              SHA is the full 40-character hexadecimal Git SHA-1 object ID used to
                              discover and execute the workflow. For a deleted push ref, it is resolved
                              from the repository's default branch and does not belong to Ref.
                            pattern: ^[0-9a-f]{40}$
                            type: string
                        required:
                        - ref
                        - sha
                        type: object
                    required:
                    - event
                    - repository
                    - revision
                    type: object
                    x-kubernetes-validations:
                    - message: revision.headRef must be specified exactly for pull_request
                        events
                      rule: 'self.event.name == ''pull_request'' ? has(self.revision.headRef)
                        : !has(self.revision.headRef)'
                    - message: push revision.ref must identify a branch or tag
                      rule: self.event.name != 'push' || self.revision.ref.startsWith('refs/heads/')
                        || self.revision.ref.startsWith('refs/tags/')
                    - message: pull_request revision.ref must identify its merge ref,
                        or its base branch when merged and closed
                      rule: self.event.name != 'pull_request' || self.revision.ref.matches('^refs/pull/[1-9][0-9]*/merge$')
                        || (self.event.action == 'closed' && self.revision.ref.startsWith('refs/heads/'))
                    - message: merge_group revision.ref must identify a merge queue
                        branch
                      rule: self.event.name != 'merge_group' || self.revision.ref.startsWith('refs/heads/gh-readonly-queue/')
                  type:
                    description: Type selects the source data variant.
                    enum:
                    - GitHub
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: github must be specified exactly when type is GitHub
                  rule: 'self.type == ''GitHub'' ? has(self.github) : !has(self.github)'
              workflowPath:
                description: WorkflowPath is the repository-relative path of the selected
                  workflow.
                maxLength: 512
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must end in .yaml or .yml
                  rule: self.endsWith('.yaml') || self.endsWith('.yml')
                - message: must be a repository-relative path without empty or '.'
                    path segments
                  rule: '!self.startsWith(''/'') && !self.contains(''//'') && !self.startsWith(''./'')
                    && !self.contains(''/./'')'
                - message: must not contain '..' path segments
                  rule: '!self.startsWith(''../'') && !self.contains(''/../'')'
            required:
            - projectRef
            - source
            - workflowPath
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: '`projectRef.name` must be specified'
              rule: size(self.projectRef.name) > 0
            - message: '`projectRef.name` must be no more than 253 characters'
              rule: size(self.projectRef.name) <= 253
            - message: '`projectRef.name` must be a DNS subdomain'
              rule: self.projectRef.name.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
          status:
            description: WorkflowRunStatus contains observations made while executing
              a workflow.
            properties:
              completionTime:
                description: CompletionTime is when the run reached a terminal result.
                format: date-time
                type: string
              concurrencyGroup:
                description: ConcurrencyGroup is the evaluated workflow concurrency
                  key, when present.
                maxLength: 256
                type: string
              conditions:
                description: |-
                  Conditions describe planning and the terminal result.
                  Known condition types are Planned and Succeeded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jobs:
                description: Jobs summarizes WorkflowJobs owned by this run.
                properties:
                  active:
                    description: Active is the number of assigned jobs that have not
                      reached a terminal condition.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  failed:
                    description: Failed is the number of jobs with a failed terminal
                      condition.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  queued:
                    description: Queued is the number of jobs waiting for a matching
                      Runner.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  succeeded:
                    description: Succeeded is the number of jobs with a successful
                      terminal condition.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  total:
                    description: Total is the number of jobs defined by the workflow.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              startTime:
                description: StartTime is when the first child Job started.
                format: date-time
                type: string
              workflowName:
                description: WorkflowName is the display name read from the selected
                  workflow file.
                maxLength: 256
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
