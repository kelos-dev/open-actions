                x-kubernetes-list-type: map
              idleReplicas:
                description: |-
                  IdleReplicas is the number of ready, non-terminating managed Runners that
                  are not assigned a WorkflowJob.
                format: int32
                type: integer
              observedGeneration:
                description: |-
