---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    helm.sh/resource-policy: keep
  name: runners.actions.kelos.dev
spec:
  group: actions.kelos.dev
  names:
    kind: Runner
    listKind: RunnerList
    plural: runners
    singular: runner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Busy")].status
      name: Busy
      type: string
    - jsonPath: .status.workflowJobRef.name
      name: WorkflowJob
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Runner represents one execution agent that accepts one matching WorkflowJob
          at a time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunnerSpec describes one execution agent that accepts one matching
              WorkflowJob at a time.
            properties:
              execution:
                description: |-
                  Execution describes the supported configuration of the environment used
                  to execute assigned WorkflowJobs. The controller owns the underlying Pod
                  and Job configuration. Changes apply only to Jobs created afterward.
                properties:
                  docker:
                    description: |-
                      Docker configures a job-scoped Docker daemon. The daemon runs in a
                      privileged sidecar and is available to workflow steps through DOCKER_HOST.
                    properties:
                      image:
                        description: |-
                          Image is a Docker-in-Docker image whose entrypoint accepts dockerd as its
                          first argument and provides the docker CLI for readiness checks.
                        maxLength: 2048
                        minLength: 1
                        pattern: ^[^[:space:]]+$
                        type: string
                      resources:
                        description: |-
                          Resources describes the compute resources available to the Docker daemon
                          and the containers it starts. An ephemeral-storage limit also sets the
                          size limit of the Docker data volume.
                        properties:
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits describes the maximum compute resources
                              available to the container.
                            maxProperties: 7
                            type: object
                            x-kubernetes-validations:
                            - message: resource names must be qualified names
                              rule: self.all(k, size(k.split('/')) <= 2 && size(k.split('/')[size(k.split('/'))
                                - 1]) <= 63 && k.split('/')[size(k.split('/')) - 1].matches('^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$')
                                && (size(k.split('/')) == 1 || (size(k.split('/')[0])
                                <= 253 && k.split('/')[0].split('.').all(p, size(p)
                                <= 63 && p.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')))))
                            - message: unprefixed resource names must be standard
                                container resources
                              rule: self.all(k, k == 'cpu' || k == 'memory' || k ==
                                'ephemeral-storage' || k.startsWith('hugepages-')
                                || k.contains('/'))
                            - message: resource quantities must not be negative
                              rule: self.all(k, sign(quantity(string(self[k]))) >=
                                0)
                            - message: extended resource quantities must be whole
                                numbers
                              rule: self.all(k, !k.contains('/') || quantity(string(self[k])).isInteger())
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests describes the minimum compute resources
                              reserved for the container.
                            maxProperties: 7
                            type: object
                            x-kubernetes-validations:
                            - message: resource names must be qualified names
                              rule: self.all(k, size(k.split('/')) <= 2 && size(k.split('/')[size(k.split('/'))
                                - 1]) <= 63 && k.split('/')[size(k.split('/')) - 1].matches('^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$')
                                && (size(k.split('/')) == 1 || (size(k.split('/')[0])
                                <= 253 && k.split('/')[0].split('.').all(p, size(p)
                                <= 63 && p.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')))))
                            - message: unprefixed resource names must be standard
                                container resources
                              rule: self.all(k, k == 'cpu' || k == 'memory' || k ==
                                'ephemeral-storage' || k.startsWith('hugepages-')
                                || k.contains('/'))
                            - message: resource quantities must not be negative
                              rule: self.all(k, sign(quantity(string(self[k]))) >=
                                0)
                            - message: extended resource quantities must be whole
                                numbers
                              rule: self.all(k, !k.contains('/') || quantity(string(self[k])).isInteger())
                        type: object
                        x-kubernetes-validations:
                        - message: resource requests must not exceed limits
                          rule: '!has(self.requests) || !has(self.limits) || self.requests.all(k,
                            !(k in self.limits) || !quantity(string(self.requests[k])).isGreaterThan(quantity(string(self.limits[k]))))'
                        - message: extended and huge-page resource requests require
                            an equal limit
                          rule: '!has(self.requests) || self.requests.all(k, k ==
                            ''cpu'' || k == ''memory'' || k == ''ephemeral-storage''
                            || (has(self.limits) && k in self.limits && quantity(string(self.requests[k])).compareTo(quantity(string(self.limits[k])))
                            == 0))'
                    required:
                    - image
                    type: object
                  image:
                    description: |-
                      Image is a container image whose entrypoint launches the Open Actions
                      runner.
                    maxLength: 2048
                    minLength: 1
                    pattern: ^[^[:space:]]+$
                    type: string
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy controls when Kubernetes pulls the runner image. Omit it
                      to use Kubernetes image pull policy defaulting.
                    enum:
                    - Always
                    - Never
                    - IfNotPresent
                    type: string
                  imagePullSecrets:
                    description: |-
                      ImagePullSecrets identifies Secrets in the Runner's namespace that
                      Kubernetes uses to pull images for the workflow Pod.
                    items:
                      description: |-
                        RunnerImagePullSecretReference identifies an image pull Secret in the
                        Runner's namespace.
                      properties:
                        name:
                          description: Name is the name of the Secret.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  resources:
                    description: Resources describes the compute resources available
                      to the runner.
                    properties:
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: Limits describes the maximum compute resources
                          available to the container.
                        maxProperties: 7
                        type: object
                        x-kubernetes-validations:
                        - message: resource names must be qualified names
                          rule: self.all(k, size(k.split('/')) <= 2 && size(k.split('/')[size(k.split('/'))
                            - 1]) <= 63 && k.split('/')[size(k.split('/')) - 1].matches('^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$')
                            && (size(k.split('/')) == 1 || (size(k.split('/')[0])
                            <= 253 && k.split('/')[0].split('.').all(p, size(p) <=
                            63 && p.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')))))
                        - message: unprefixed resource names must be standard container
                            resources
                          rule: self.all(k, k == 'cpu' || k == 'memory' || k == 'ephemeral-storage'
