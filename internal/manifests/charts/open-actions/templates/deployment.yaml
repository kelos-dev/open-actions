apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-actions-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: open-actions
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-actions
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-actions
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: open-actions-controller
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --leader-elect=true
            - {{ printf "--github-api-url=%s" .Values.controller.githubAPIURL | quote }}
            - {{ printf "--github-server-url=%s" .Values.controller.githubServerURL | quote }}
            {{- if .Values.controller.actionCloneBaseURL }}
            - {{ printf "--action-clone-base-url=%s" .Values.controller.actionCloneBaseURL | quote }}
            {{- end }}
            - {{ printf "--max-job-timeout=%s" .Values.controller.maxJobTimeout | quote }}
            {{- if ne .Values.controller.workflowRunTTLSecondsAfterFinished nil }}
            - {{ printf "--workflow-run-ttl-seconds-after-finished=%d" (int64 .Values.controller.workflowRunTTLSecondsAfterFinished) | quote }}
            {{- end }}
            {{- if .Values.console.enabled }}
            - {{ printf "--console-url=%s" .Values.console.publicURL | quote }}
            {{- end }}
            {{- if .Values.artifacts.enabled }}
            - {{ printf "--artifact-service-url=http://open-actions-artifacts.%s.svc" .Release.Namespace | quote }}
            - --artifact-signing-key-file=/var/run/secrets/open-actions-artifacts/signing-key
            - {{ printf "--artifact-max-retention-days=%d" (int64 .Values.artifacts.maxRetentionDays) | quote }}
            {{- end }}
          ports:
            - name: webhook
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8082
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if .Values.artifacts.enabled }}
            - name: artifact-auth
              mountPath: /var/run/secrets/open-actions-artifacts
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: temporary
          emptyDir: {}
        {{- if .Values.artifacts.enabled }}
        - name: artifact-auth
          secret:
            secretName: {{ default "open-actions-artifact-auth" .Values.artifacts.signingKeySecretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.artifacts.signingKeyKey }}
                path: signing-key
        {{- end }}
      terminationGracePeriodSeconds: 10
