name: E2E

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: 3.20.1
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Build images
        run: make image WHAT="cmd/open-actions-controller cmd/open-actions-console cmd/open-actions-runner test/fixture/github" VERSION=e2e
      - name: Load images
        run: |
          kind load docker-image ghcr.io/kelos-dev/open-actions-controller:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-console:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-runner:e2e
          kind load docker-image ghcr.io/kelos-dev/open-actions-fixture:e2e
      - name: Build CLI
        run: make build WHAT=cmd/open-actions
      - name: Install control plane
        run: bin/open-actions install --values config/e2e/values.yaml
      - name: Deploy GitHub fixture
        run: kubectl apply -f config/e2e/fixture.yaml
      - name: Wait for components
        run: |
          kubectl wait --for=condition=Available --timeout=180s \
            --namespace open-actions-system \
            deployment/open-actions-controller \
            deployment/open-actions-console \
            deployment/github-fixture
      - name: End-to-end test
        env:
          E2E_PROCS: "4"
          E2E_RUNNER_IMAGE: ghcr.io/kelos-dev/open-actions-runner:e2e
        run: make test-e2e
